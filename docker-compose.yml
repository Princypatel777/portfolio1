# ==============================================================================
# Practical 11: Multi-Container Orchestration with Docker Compose
# Services: frontend (React/Vite) ──► backend (Node/Express) ──► mongodb (Mongo)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 2. Node.js & Express REST Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 3. React Frontend Service (Vite Production Preview)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - app-network

# ------------------------------------------------------------------------------
# Bridge Network for Inter-Container Communication
# ------------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volume for MongoDB Database Storage
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    driver: local
